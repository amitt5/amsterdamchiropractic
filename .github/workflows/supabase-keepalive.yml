name: Supabase keepalive

# Free-tier Supabase projects are paused after about a week without API
# traffic. One read a day keeps this one awake. Nothing is written.

on:
  schedule:
    - cron: "0 8 * * *" # daily, 08:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the REST API
        env:
          SUPABASE_URL: https://tvvawwjhgrscmdlwesll.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/appointments?select=id&limit=1")
          echo "Supabase answered $status"
          test "$status" = "200"
